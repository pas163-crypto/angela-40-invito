<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>OG Preview — 40 Angela</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Great+Vibes&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #07110e; }
    .card {
      position: relative;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 70% at 50% -10%, rgba(212, 24, 58, 0.45), transparent 55%),
        radial-gradient(ellipse 50% 50% at 90% 80%, rgba(232, 201, 122, 0.18), transparent 50%),
        radial-gradient(ellipse 45% 55% at 8% 70%, rgba(26, 80, 60, 0.5), transparent 55%),
        linear-gradient(160deg, #07110e 0%, #0d1c18 50%, #0a1412 100%);
      color: #f8f2e8;
      font-family: "Playfair Display", Georgia, serif;
    }
    .stars {
      position: absolute; inset: 0;
      background:
        radial-gradient(2px 2px at 12% 20%, rgba(255,255,255,.8), transparent),
        radial-gradient(1.5px 1.5px at 28% 55%, rgba(255,255,255,.55), transparent),
        radial-gradient(2px 2px at 72% 18%, rgba(255,255,255,.7), transparent),
        radial-gradient(1.5px 1.5px at 88% 42%, rgba(255,255,255,.5), transparent),
        radial-gradient(1.5px 1.5px at 48% 78%, rgba(255,255,255,.45), transparent),
        radial-gradient(2px 2px at 64% 62%, rgba(255,255,255,.6), transparent);
    }
    .frame {
      position: absolute;
      inset: 28px;
      border: 1px solid rgba(232, 201, 122, 0.45);
    }
    .frame::before, .frame::after {
      content: "";
      position: absolute;
      width: 36px; height: 36px;
      border: 1px solid #e8c97a;
    }
    .frame::before { top: 10px; left: 10px; border-right: 0; border-bottom: 0; }
    .frame::after { bottom: 10px; right: 10px; border-left: 0; border-top: 0; }
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px;
    }
    .eyebrow {
      font-family: Cinzel, Georgia, serif;
      font-size: 18px;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: #e8c97a;
      margin-bottom: 18px;
      padding-left: 0.42em;
    }
    .age-row {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 0;
    }
    .age {
      font-size: 148px;
      font-weight: 700;
      line-height: 0.9;
      letter-spacing: -0.04em;
      padding-bottom: 0.06em;
      background: linear-gradient(175deg, #fff6d8 8%, #ffe08a 28%, #d4183a 75%, #7a1024 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 12px 28px rgba(212, 24, 58, 0.4));
    }
    .anni {
      font-family: Cinzel, Georgia, serif;
      font-size: 20px;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #ffe7a8;
      padding-left: 0.5em;
      transform: translateY(-12px);
    }
    .name {
      font-family: "Great Vibes", cursive;
      font-size: 100px;
      line-height: 1.15;
      margin: 10px 0 8px;
      padding-top: 0.08em;
      background: linear-gradient(180deg, #fff, #f8f2e8 40%, #e8c97a);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .meta {
      font-family: "Playfair Display", Georgia, serif;
      font-style: italic;
      font-size: 28px;
      color: #d2c3ab;
      margin-top: 6px;
    }
    .venue {
      margin-top: 10px;
      font-family: Cinzel, Georgia, serif;
      font-size: 16px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #e8c97a;
      padding-left: 0.28em;
    }
    .baubles {
      display: flex;
      gap: 14px;
      margin-top: 22px;
    }
    .b {
      width: 12px; height: 12px; border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ff8a9a, #d4183a 70%);
      box-shadow: 0 0 14px rgba(212,24,58,.55);
    }
    .b.g { background: radial-gradient(circle at 35% 30%, #fff0c2, #e8c97a 70%); box-shadow: 0 0 14px rgba(232,201,122,.55); }
    .b.p { background: radial-gradient(circle at 35% 30%, #6db38a, #1f5a42 70%); box-shadow: 0 0 14px rgba(45,120,90,.45); }
  </style>
</head>
<body>
  <div class="card">
    <div class="stars"></div>
    <div class="frame"></div>
    <div class="content">
      <p class="eyebrow">La settimana prima di Natale</p>
      <div class="age-row">
        <p class="age">40</p>
        <p class="anni">anni</p>
      </div>
      <p class="name">Angela</p>
      <p class="meta">venerdì 18 dicembre 2026 · ore 20:00</p>
      <p class="venue">Giallo Datterino · Villaricca</p>
      <div class="baubles" aria-hidden="true">
        <span class="b"></span><span class="b g"></span><span class="b p"></span><span class="b g"></span><span class="b"></span>
      </div>
    </div>
  </div>
</body>
</html>
